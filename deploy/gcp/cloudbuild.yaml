steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/soc-dashboard/app:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/soc-dashboard/app:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, us-central1-docker.pkg.dev/$PROJECT_ID/soc-dashboard/app]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - services
      - replace
      - deploy/gcp/cloudrun.service.yaml
      - --region
      - us-central1

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/soc-dashboard/app:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/soc-dashboard/app:latest

options:
  logging: CLOUD_LOGGING_ONLY
