# Copy to secret.yaml, fill in values, then:
#   kubectl apply -f secret.yaml -n security-tools
# Never commit secret.yaml to version control.
apiVersion: v1
kind: Secret
metadata:
  name: soc-dashboard-secrets
  namespace: security-tools
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@postgres-host:5432/soc_dashboard"
  FLASK_SECRET_KEY: "YOUR_FLASK_SECRET_KEY"
  ALERTS_API_KEY: "YOUR_ALERTS_API_KEY"
  DB_ENCRYPTION_KEY: "YOUR_FERNET_COMPATIBLE_KEY"
