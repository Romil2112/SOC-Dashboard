apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-dashboard
  namespace: security-tools
  labels:
    app.kubernetes.io/name: soc-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soc-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soc-dashboard
    spec:
      containers:
        - name: soc-dashboard
          image: us-central1-docker.pkg.dev/PROJECT_ID/soc-dashboard/app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: soc-dashboard-secrets
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /login
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
